<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tea Break Uploader</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:0 auto;padding:40px 16px;line-height:1.6;color:#222;background:#fffaf0;text-align:center}h1{font-size:1.6em}</style></head>
<body><h1 id="h">☕ Tea Break Uploader</h1><p id="msg">Checking…</p>
<script>
const q = new URLSearchParams(location.search);
const h = document.getElementById('h'), m = document.getElementById('msg');
if (q.get('error')) { h.textContent = 'TikTok was not connected'; m.textContent = 'TikTok said: ' + (q.get('error_description') || q.get('error')) + '. You can close this page and try again.'; }
else if (q.get('code')) { h.textContent = '✅ TikTok approved the connection'; m.textContent = 'You can close this page and go back to Claude.'; }
else { m.textContent = 'This page is where TikTok sends you back after you connect your account to Tea Break Uploader.'; }
</script></body></html>
